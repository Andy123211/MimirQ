name: mimirq-hybrid-lab
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Small, isolated runtime for this synthetic local RAG experiment.
      # It intentionally avoids MimirQ's DB, OCR, web, and service dependencies.
      - torch==2.13.0
      - torchvision==0.28.0
      - sentence-transformers==5.3.0
      - huggingface-hub==1.9.2
      - modelscope==1.40.1
      - langchain==1.3.9
      - langchain-core==1.4.8
      - langchain-community==0.4.1
      - langchain-text-splitters==1.1.2
      - pydantic==2.12.5
      - pydantic-settings==2.14.2
      - email-validator==2.3.0
      - python-dotenv==1.2.2
      - rank-bm25==0.2.2
      - jieba==0.42.1
      - numpy==2.4.4
      - requests==2.33.1
      - httpx[http2,socks]==0.28.1
